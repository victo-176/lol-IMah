version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: ivasms-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  bot:
    build: .
    container_name: ivasms-bot
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_GROUP_ID=${TELEGRAM_GROUP_ID}
      - TELEGRAM_ADMIN_IDS=${TELEGRAM_ADMIN_IDS}
      - IVASMS_WSS_URL=${IVASMS_WSS_URL}
      - IVASMS_AUTH_TOKEN=${IVASMS_AUTH_TOKEN}
      - IVASMS_USER_ID=${IVASMS_USER_ID}
      - DEFAULT_CLAIM_TTL_MINUTES=${DEFAULT_CLAIM_TTL_MINUTES:-15}
      - EXCLUSIVE_CLAIM_MODE=${EXCLUSIVE_CLAIM_MODE:-true}
      - COST_PER_OTP_CREDITS=${COST_PER_OTP_CREDITS:-1.0}
      - INITIAL_USER_BALANCE=${INITIAL_USER_BALANCE:-10.0}
      - MIN_WITHDRAWAL_AMOUNT=${MIN_WITHDRAWAL_AMOUNT:-5.0}
      - MAX_DAILY_CLAIMS=${MAX_DAILY_CLAIMS:-10}
    volumes:
      - bot_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
  bot_data:
